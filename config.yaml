# Generated with Claude Code (Anthropic): single source of paths, seeds and hyperparameters.
# All paths are relative to the repository root.
# Hyperparameters are starting values. Tune them by cross-validation on the training set only.

seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  features_dir: data/features
  figures_dir: results/figures
  tables_dir: results/tables
  models_dir: results/models
  logs_dir: results/logs
  # Saved outputs that back the results: learning curves, per-cut predictions, chosen settings.
  # Unlike results/models they are committed, so the results can be checked without re-training.
  # They hold cut ids and species labels, never audio.
  outputs_dir: results/outputs

data:
  hf_repo_id: confit/wmms-parquet
  hf_revision: a90a38e0006991f0c6f6d4e05261949a1da7f14e
  expected_cuts: 1697

prepare:
  min_cuts_per_species: 20
  # Cuts are grouped by recording tape: the first five digits of the Watkins file name, for
  # example tape 72021 in 72021005.wav. Stage 02 refuses to run while this is null. It never
  # falls back to a random split.
  grouping_key: tape_id
  # At least one tape for the test set and two for training, so that every species is in the
  # test set and in the training part of every cross-validation fold.
  min_groups_per_species: 3
  test_fraction: 0.15
  # Grouped cross-validation folds of the training set, used to tune hyperparameters.
  n_cv_folds: 5

features:
  # Every cut is resampled to this rate. Native rates run from 600 Hz to 166.6 kHz, and cuts
  # recorded below this rate have nothing above half their native rate; stage 05 checks how
  # much that alone reveals about species.
  sample_rate: 16000
  # Scale each cut so its loudest sample is 1, removing differences in recording gain.
  peak_normalise: true
  n_mfcc: 13
  n_fft: 512
  hop_length: 160
  n_mels: 40
  fmin: 0
  fmax: 8000
  delta_width: 9

unsupervised:
  pca_variance_to_keep: 0.95
  gmm_k_min: 2
  gmm_k_max: 40
  gmm_covariance_type: diag
  gmm_n_init: 5

baseline:
  c_grid: [0.01, 0.1, 1.0, 10.0]
  max_iter: 2000

lstm:
  hidden_size: 64
  num_layers: 1
  dropout: 0.3
  window_seconds: 3.0
  window_hop_seconds: 1.5
  batch_size: 64
  # Windows per batch when predicting; it only affects speed and memory.
  eval_batch_size: 256
  # Chosen in a pilot on validation fold 0, together with averaging the LSTM outputs over the
  # window. Stage 05b regenerates that pilot from the lstm_pilot section below.
  learning_rate: 0.003
  # Each epoch shows the model one randomly placed window of every training cut. Each model
  # keeps the number of epochs, from 1 to max_epochs, with the best macro-F1 on its validation
  # curve averaged over the seeds. In the pilot the best epoch was 26.
  max_epochs: 40
  # CPU threads for each LSTM training. Fixed because the same seed gives different results on a
  # different number of threads, through rounding. A different CPU may still differ slightly.
  # A model this small gains little from more threads; running several trainings at once is faster.
  num_threads: 2
  # How many LSTM trainings run at once, each in its own process on num_threads threads. Lowered
  # automatically on a computer with fewer CPUs. It changes only the speed: every training sets
  # its own seed and threads, so the results are the same for any value.
  n_jobs: 4
  # The LSTM and its shuffled control are trained on the same seeds: the seed at the top of this
  # file, then the next integers. The seed alone moved the best macro-F1 by 0.017, more than the
  # gap being measured between the two models.
  n_seeds: 5

evaluation:
  # Keep false until hyperparameters are frozen. The test set is then used once.
  evaluate_test: false
  n_bootstrap: 2000
  ci_level: 0.95
  # Random guesses averaged to give the chance-level scores.
  n_chance_draws: 1000
  # Robustness check on the test set: repeat the comparison with only the cuts recorded at
  # this rate or above, keeping the species that still pass stage 02's thresholds.
  robustness_min_sample_rate: 16000
  # Test scores are reported with and without these species. All their test cuts are on tapes
  # 78018 and 77028, where other cuts (dropped in stage 02) also carried a second species label,
  # so these tapes may hold both species and their labels are doubtful.
  doubtful_species: [Bearded_Seal, Long-Finned_Pilot_Whale]

sensitivity:
  # Stage 05a: how many times the comparison that drops tapes at random is repeated.
  same_period_repeats: 10

lstm_pilot:
  # Stage 05b: the pilot behind lstm.learning_rate and averaging the LSTM outputs. It uses one
  # validation fold and training cuts only. The first variant is the first design.
  fold: 0
  variants:
    - {use_last_output: true, learning_rate: 0.001, epochs: 80, shuffle_order: false}
    - {use_last_output: true, learning_rate: 0.001, epochs: 80, shuffle_order: true}
    - {use_last_output: true, learning_rate: 0.003, epochs: 50, shuffle_order: false}
    - {use_last_output: false, learning_rate: 0.001, epochs: 50, shuffle_order: false}
    - {use_last_output: false, learning_rate: 0.003, epochs: 50, shuffle_order: false}
