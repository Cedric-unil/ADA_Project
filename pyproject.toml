# Generated with Claude Code (Anthropic): make src/ importable with pip install -e . and configure ruff and pytest.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoacoustics"
version = "0.1.0"
description = "Spectral shape or temporal structure? Species identity in marine mammal vocalizations."
readme = "README.md"
requires-python = ">=3.13"
# Pinned dependencies live in requirements.txt, the single source of versions.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
